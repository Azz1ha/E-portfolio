<svg width="280" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="280" height="200" fill="url(#grad2)" rx="10"/>
  <!-- Code brackets -->
  <text x="60" y="60" fill="white" font-family="monospace" font-size="24" opacity="0.8">{</text>
  <text x="220" y="60" fill="white" font-family="monospace" font-size="24" opacity="0.8">}</text>
  <text x="60" y="140" fill="white" font-family="monospace" font-size="24" opacity="0.8">{</text>
  <text x="220" y="140" fill="white" font-family="monospace" font-size="24" opacity="0.8">}</text>

  <!-- Code lines -->
  <rect x="80" y="50" width="40" height="3" fill="white" opacity="0.7" rx="1"/>
  <rect x="80" y="60" width="60" height="3" fill="white" opacity="0.7" rx="1"/>
  <rect x="80" y="70" width="50" height="3" fill="white" opacity="0.7" rx="1"/>

  <rect x="80" y="130" width="35" height="3" fill="white" opacity="0.7" rx="1"/>
  <rect x="80" y="140" width="55" height="3" fill="white" opacity="0.7" rx="1"/>
  <rect x="80" y="150" width="45" height="3" fill="white" opacity="0.7" rx="1"/>

  <!-- Flow arrows -->
  <polygon points="140,90 150,85 150,95" fill="white" opacity="0.8"/>
  <line x1="80" y1="100" x2="140" y2="100" stroke="white" stroke-width="2" opacity="0.8"/>

  <text x="140" y="175" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Algorithmique</text>
  <text x="140" y="190" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" opacity="0.8">SAE1.03</text>
</svg>